# WeRent Backend — local PostgreSQL 16 (dev + test databases)
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: werent-postgres
    environment:
      POSTGRES_USER: werent
      POSTGRES_PASSWORD: werent
      POSTGRES_DB: werent
    ports:
      - "5432:5432"
    volumes:
      - werent-pgdata:/var/lib/postgresql/data
      # Creates the dedicated test database on first boot (new volume only).
      - ./prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werent -d werent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  werent-pgdata:
